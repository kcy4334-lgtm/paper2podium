meta:
  title: "Pulse charging deepens the anode's fade"
  subtitle: "Capacity fade in fast-charged cells under two protocols"
  author: "Fixture Author"
  venue: "Synthetic Conference 2026"
  wpm: 135
  aspect: "16:9"
