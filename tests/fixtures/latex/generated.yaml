# Build-output check config — checks the set that build_deck/build_pptx/build_script produce against the paper.
#
# ★The test copies this file into a temp folder to use. The build output is
#   created in that folder, and paper.tex, numbers.md, banned.txt,
#   figvalues.txt are copied there as well.
#
# ★Watch the backslashes in `coverage_pattern`. Building this file with a
#   shell heredoc strips one layer off `\\textbf`, leaving `\textbf`, and the
#   regex reads that as a **tab character**, so section E silently reports
#   zero kinds. It happened for real. Write it with an editor and check by eye.

root: .

source: [paper.tex]

derivative:
  deck:   talk.tex
  pptx:   talk.pptx
  spoken: script.md

sidecar: figvalues.txt
syntax: latex
drop_commands: [note]

# numbers that are not content — font sizes (40/46/10), aspect ratio (16), conference year (2026)
skip_numbers: [16, 10, 40, 46, 2026]

ban_file: banned.txt

page_denominator: 3
ok_fonts: [Arial, Courier New]
aspect: "16:9"

coverage_pattern: '&\s*(?:\\textbf\{)?(?:\\textminus)?(\d{1,2}\.\d)'

claims:
  - {label: anode CC-CV,   value: "12.3", source: 'textminus12\.3'}
  - {label: anode pulse,   value: "45.6", source: 'textminus45\.6'}

# the deck casually calls the manuscript's "capacity" "retention" — noted here
coined_ok: [retention]
