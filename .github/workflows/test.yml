name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      # LaTeX (Beamer + metropolis) only on Linux; the tests that need pdflatex skip elsewhere.
      - name: Install LaTeX
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern fonts-lmodern
      - name: Run tests (warnings are errors)
        env:
          PYTHONIOENCODING: utf-8
        run: python -W error::ResourceWarning -m unittest discover tests -v
      - name: Fixtures must actually pass
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/deckcheck.py tests/fixtures/latex/config.yaml
          python scripts/deckcheck.py tests/fixtures/markdown/config.yaml
      - name: Build the example end to end
        if: runner.os == 'Linux'
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/build.py examples/filled-slides.yaml -o out
